# Verify Live API Hub docs URLs weekly and commit the updated statuses.
# Runs every Sunday at 00:00 UTC, or manually from the Actions tab.
# No secrets needed: the script only makes anonymous GET requests.

name: Verify APIs

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check docs URLs and update statuses
        run: python3 scripts/verify.py

      - name: Commit updated statuses
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/apis.json site/data/apis.json
          git diff --cached --quiet || git commit -m "chore: weekly API status update [skip ci]"
          git push
